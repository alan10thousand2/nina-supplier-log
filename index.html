<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>供應商聯絡人搜尋工具</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "PingFang HK", Roboto, system-ui, sans-serif;
        background: #f4f7fc;
        padding: 5px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      .app {
        max-width: 1400px;
        width: 100%;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
        padding: 30px 28px 40px;
        transition: all 0.2s;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        color: #0a1e3c;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }
      h1 small {
        font-size: 16px;
        font-weight: 400;
        color: #5a6f8c;
        margin-left: 8px;
      }
      .sub {
        color: #5f7a9a;
        font-size: 15px;
        border-left: 4px solid #2a7de1;
        padding-left: 16px;
        margin-bottom: 28px;
        background: #f0f5fe;
        border-radius: 0 12px 12px 0;
        line-height: 1.6;
      }
      .search-area {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 28px;
        align-items: center;
        background: #f8faff;
        padding: 18px 22px;
        border-radius: 16px;
        border: 1px solid #e6edf6;
      }
      .search-area label {
        font-weight: 500;
        color: #1f3a5f;
        font-size: 15px;
        white-space: nowrap;
      }
      .search-area input {
        flex: 1;
        min-width: 220px;
        padding: 12px 18px;
        border: 1.5px solid #d6e0ec;
        border-radius: 12px;
        font-size: 16px;
        background: #ffffff;
        transition: 0.2s;
        outline: none;
        color: #0a1e3c;
      }
      .search-area input:focus {
        border-color: #2a7de1;
        box-shadow: 0 0 0 4px rgba(42, 125, 225, 0.12);
      }
      .search-area button {
        padding: 12px 34px;
        background: #1a5bbf;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        letter-spacing: 0.4px;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(26, 91, 191, 0.25);
      }
      .search-area button:hover {
        background: #0f4aa8;
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(26, 91, 191, 0.32);
      }
      .search-area button:active {
        transform: translateY(0);
      }
      .search-area .clear-btn {
        background: #e9eef5;
        color: #2d4b74;
        box-shadow: none;
        padding: 12px 20px;
      }
      .search-area .clear-btn:hover {
        background: #dce3ed;
        box-shadow: none;
        transform: none;
      }
      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px 0 18px;
        border-bottom: 1px solid #e9eff6;
        margin-bottom: 22px;
      }
      .stats .count {
        font-size: 15px;
        color: #1f3a5f;
        background: #eef4fb;
        padding: 4px 18px;
        border-radius: 30px;
        font-weight: 500;
      }
      .stats .count strong {
        color: #0a1e3c;
        font-size: 18px;
      }
      .stats .hint {
        color: #6e8aad;
        font-size: 14px;
      }
      .table-wrap {
        overflow-x: auto;
        border-radius: 14px;
        border: 1px solid #e6edf6;
        background: #ffffff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        min-width: 800px;
      }
      thead {
        background: #f0f6fe;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      thead th {
        text-align: left;
        padding: 14px 16px;
        font-weight: 600;
        color: #1a3a60;
        border-bottom: 2px solid #d6e2f0;
        font-size: 13px;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      thead th:not(:last-child) {
        border-right: 1px solid #e2ebf5;
      }
      tbody tr {
        transition: background 0.08s;
        border-bottom: 1px solid #edf2f9;
      }
      tbody tr:hover {
        background: #f6faff;
      }
      tbody td {
        padding: 12px 16px;
        vertical-align: middle;
        color: #142b47;
        word-break: break-word;
      }
      tbody td:not(:last-child) {
        border-right: 1px solid #edf2f9;
      }
      .highlight {
        background: #fcee8f;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 500;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px 50px;
        color: #6e8aad;
      }
      .empty-state .icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-state p {
        font-size: 16px;
        max-width: 420px;
        margin: 0 auto;
        line-height: 1.6;
      }
      .empty-state .sub-hint {
        font-size: 14px;
        color: #95adcc;
        margin-top: 8px;
      }
      .footer-note {
        margin-top: 20px;
        text-align: right;
        font-size: 13px;
        color: #8aa3c2;
        border-top: 1px solid #eef4fb;
        padding-top: 16px;
      }
      @media (max-width: 720px) {
        .app {
          padding: 8px 7px 12px;
        }
        h1 {
          font-size: 22px;
          flex-wrap: wrap;
        }
        h1 small {
          font-size: 14px;
          margin-left: 0;
        }
        .search-area {
          flex-direction: column;
          align-items: stretch;
          padding: 16px;
        }
        .search-area input {
          min-width: 0;
        }
        .search-area button {
          width: 100%;
          justify-content: center;
        }
        .stats {
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
        }
        thead th,
        tbody td {
          padding: 10px 12px;
          font-size: 13px;
        }
        table {
          font-size: 13px;
          min-width: 600px;
        }
      }
      @media (max-width: 480px) {
        .app {
          padding: 10px 8px 16px;
        }
        h1 {
          font-size: 19px;
        }
        .search-area {
          padding: 12px;
        }
        .search-area input {
          font-size: 15px;
          padding: 10px 14px;
        }
        .search-area button {
          font-size: 15px;
          padding: 10px 16px;
        }
        table {
          font-size: 12px;
          min-width: 480px;
        }
        thead th,
        tbody td {
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <h1>
        📇 供應商聯絡人
        <small>搜尋工具</small>
      </h1>
      <div class="sub">
        🔍
        輸入公司名稱、人名、電話號碼、卡號或備註嘅部分內容，系統會幫你搵出所有近似記錄
      </div>

      <div class="search-area">
        <label for="searchInput">🔎 搜尋</label>
        <input
          type="text"
          id="searchInput"
          placeholder="例如：翠湖 / 陳 / 66566648 / G576 / 備註關鍵字"

        />
        <button id="searchBtn">搜尋</button>
        <button class="clear-btn" id="clearBtn">✕ 清除</button>
      </div>

      <div class="stats" id="statsBar">
        <span class="count">📌 總記錄：<strong id="totalCount">0</strong></span>
        <span class="hint" id="resultHint">輸入關鍵字後按「搜尋」或 Enter</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 14%">供應商名稱</th>
              <th style="width: 20%">姓名 (NAME)</th>
              <th style="width: 18%">卡號 (CARD_NO)</th>
              <th style="width: 14%">電話 (PHONE)</th>
              <th style="width: 24%">備註 (REMARK)</th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr>
              <td colspan="5">
                <div class="empty-state">
                  <div class="icon">🔎</div>
                  <p>輸入關鍵字搜尋供應商、聯絡人、電話、卡號或備註</p>
                  <div class="sub-hint">支援部份匹配，不分大小寫</div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="footer-note">
        ⚡ 共 <span id="footerTotal">0</span> 筆記錄 · 模糊搜尋（包含備註）
      </div>
    </div>

      // --------------------------------------------------------------
      // 2. 應用邏輯
      // --------------------------------------------------------------
      const data = rawData.map((row) => ({
        supplier: row[0] || "",
        name: row[1] || "",
        card: row[2] || "",
        phone: row[3] || "",
        remark: row[4] || "", // 備註
      }));

      const total = data.length;
      document.getElementById("totalCount").textContent = total;
      document.getElementById("footerTotal").textContent = total;

      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const clearBtn = document.getElementById("clearBtn");
      const resultBody = document.getElementById("resultBody");
      const resultHint = document.getElementById("resultHint");

      // 高亮函數
      function highlightText(text, keyword) {
        if (!keyword || !text) return text || "";
        const lowerText = text.toLowerCase();
        const lowerKeyword = keyword.toLowerCase();
        if (!lowerText.includes(lowerKeyword)) return text;
        const idx = lowerText.indexOf(lowerKeyword);
        const before = text.substring(0, idx);
        const matched = text.substring(idx, idx + keyword.length);
        const after = text.substring(idx + keyword.length);
        return `${before}<span class="highlight">${matched}</span>${after}`;
      }

      function renderResults(results, keyword) {
        if (!results || results.length === 0) {
          resultBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <div class="icon">🔍</div>
                                <p>搵唔到相關記錄</p>
                                <div class="sub-hint">試吓用其他關鍵字</div>
                            </div>
                        </td>
                    </tr>
                `;
          resultHint.textContent = "沒有匹配記錄";
          return;
        }

        const kw = keyword.trim();
        let html = "";
        results.forEach((item) => {
          const sup = kw ? highlightText(item.supplier, kw) : item.supplier;
          const name = kw ? highlightText(item.name, kw) : item.name;
          const card = kw ? highlightText(item.card, kw) : item.card;
          const phone = kw ? highlightText(item.phone, kw) : item.phone;
          const remark = kw ? highlightText(item.remark, kw) : item.remark;
          html += `
                    <tr>
                        <td>${sup}</td>
                        <td>${name}</td>
                        <td>${card}</td>
                        <td>${phone}</td>
                        <td>${remark}</td>
                    </tr>
                `;
        });
        resultBody.innerHTML = html;
        resultHint.textContent = `找到 ${results.length} 筆匹配記錄`;
      }

      function doSearch() {
        const rawKeyword = searchInput.value;
        const keyword = rawKeyword.trim();
        if (!keyword) {
          renderResults(data, "");
          resultHint.textContent = `顯示全部 ${total} 筆記錄`;
          return;
        }

        const lowerKeyword = keyword.toLowerCase();
        const matched = data.filter(
          (item) =>
            item.supplier.toLowerCase().includes(lowerKeyword) ||
            item.name.toLowerCase().includes(lowerKeyword) ||
            item.card.toLowerCase().includes(lowerKeyword) ||
            item.phone.toLowerCase().includes(lowerKeyword) ||
            item.remark.toLowerCase().includes(lowerKeyword),
        );
        renderResults(matched, keyword);
      }

      function clearSearch() {
        searchInput.value = "";
        searchInput.focus();
        renderResults(data, "");
        resultHint.textContent = `顯示全部 ${total} 筆記錄`;
      }

      // 事件綁定
      searchBtn.addEventListener("click", doSearch);
      clearBtn.addEventListener("click", clearSearch);

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doSearch();
        }
      });

      // 初始化：顯示全部
      renderResults(data, "");
      resultHint.textContent = `顯示全部 ${total} 筆記錄`;
    </script>
  </body>
</html>
